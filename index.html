<script>
if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') {
  var habia = !!navigator.serviceWorker.controller;
  // versión nueva: se recarga sola, pero nunca en mitad de una clase o un test (espera a que la cierres)
  var recargar = function () {
    if (window.miauRecarga) return;
    var p = document.getElementById('pantalla');
    if (p && !p.hidden) { addEventListener('miau-pantalla-cerrada', recargar, { once: true }); return; }
    window.miauRecarga = 1; location.reload();
  };
  navigator.serviceWorker.register('sw.js').then(function (reg) {
    // con la app abierta mucho rato, mira si hay versión nueva al volver a ella y cada 20 minutos
    var mirar = function () { reg.update().catch(function () {}); };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') mirar(); });
    setInterval(mirar, 20 * 60 * 1000);
  }).catch(function () {});
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (habia) recargar(); });
}
</script>
